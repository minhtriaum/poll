<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b6cf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Snack Poll v1.27</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1d2433;--sub:#6b7488;--line:#e3e7ef;--acc:#3b6cf6;--acc2:#e8eeff;--ok:#1f9d63;--bad:#d64545;--warn:#b7791f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button,input,select,textarea{font:inherit}
.wrap{max-width:860px;margin:0 auto;padding:12px 12px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0}
header.top h1{font-size:20px;margin:0}
header.top h1 small{font-size:12px;color:var(--sub);font-weight:500;margin-left:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--acc2);color:var(--acc);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
.chip.gray{background:#eceff5;color:var(--sub)}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;cursor:pointer;color:var(--sub);font-weight:600}
.nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:16px;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label.f{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
input[type=text],input[type=password],input[type=number],input[type=url],input[type=datetime-local],select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.btn{border:0;background:var(--acc);color:#fff;border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.sec{background:#eceff5;color:var(--ink)}
.btn.bad{background:#fdeaea;color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--sub);font-size:13px}
.banner{background:#fff6e0;color:var(--warn);border:1px solid #f1dfae;border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
.banner.bad{background:#fdeaea;color:var(--bad);border-color:#f3c4c4}
.item{display:flex;gap:12px;align-items:center}
.item img{width:72px;height:72px;object-fit:cover;border-radius:10px;background:#eceff5;flex:none}
.item .info{flex:1;min-width:0}
.item .info b{font-size:16px}
.item.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.tag{display:inline-block;background:#eceff5;color:var(--sub);border-radius:6px;padding:0 7px;font-size:12px;margin-left:6px}
.step{display:flex;align-items:center;gap:8px;flex:none}
.step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
.step button:disabled{opacity:.35}
.step span{min-width:22px;text-align:center;font-weight:700;font-size:17px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;z-index:5}
.bar .in{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar .tot{font-size:18px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--sub);font-size:12px;font-weight:600}
.scroll{overflow-x:auto}
.login{max-width:380px;margin:8vh auto 0}
.login h1{text-align:center;margin:0 0 4px}
.login .sub{text-align:center;color:var(--sub);margin-bottom:14px}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.overlay{position:fixed;inset:0;background:rgba(20,25,40,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:#fff;border-radius:14px;padding:18px;max-width:440px;width:100%;max-height:85vh;overflow:auto}
.modal h3{margin:0 0 8px}
.no{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:7px;background:#eceff5;color:var(--sub);font-size:12px;font-weight:700;flex:none;padding:0 5px}
.no.sm{height:20px;min-width:20px;font-size:11px;margin-right:6px}
input.pick{width:22px;height:22px;flex:none;accent-color:var(--acc);cursor:pointer;margin:0}
input.pick[type=checkbox]{border-radius:50%}
.livebox{background:#f7f8fb;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.lrow{display:grid;grid-template-columns:minmax(80px,1.4fr) 2fr minmax(70px,.9fr);gap:8px;align-items:center;padding:4px 0;font-size:14px}
.lname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbar{height:10px;border-radius:99px;background:#e3e7ef;overflow:hidden}
.lbar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.lnum{text-align:right;color:var(--sub);font-size:13px}
.ord.done{background:#f1faf5;border-color:#bfe6cf}
.ord .nm{font-size:16px;font-weight:700}
.payer{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:600;color:var(--sub)}
.payer.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bigsum{font-size:20px;font-weight:800}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1d2433;color:#fff;border-radius:99px;padding:8px 16px;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:.95}
canvas#rc{width:100%;max-width:420px;border:1px solid var(--line);border-radius:10px;margin-top:8px}
pre.txt{background:#f7f8fb;border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;font:13px/1.55 inherit;margin:8px 0 0}

html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea,label,a{touch-action:manipulation}
input[type=text],input[type=password],input[type=number],input[type=url],input[type=datetime-local],select,textarea{font-size:16px;min-height:44px}
textarea{min-height:90px}
.btn{min-height:44px}
.btn.sm{min-height:38px;padding:6px 12px}
.nav{position:sticky;top:0;z-index:6;background:var(--bg);margin:0 -12px;padding:6px 12px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{min-height:40px}
.pagehead{flex-wrap:wrap}
.wrap{padding-bottom:calc(120px + env(safe-area-inset-bottom));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
.bar{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.toast{bottom:calc(96px + env(safe-area-inset-bottom));max-width:90vw;text-align:center}
.step button{width:42px;height:42px}
input.pick{width:26px;height:26px}
input.pick[type=checkbox]{-webkit-appearance:none;appearance:none;border:2px solid #aab2c3;border-radius:50%;background:#fff;position:relative}
input.pick[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
input.pick[type=checkbox]:checked::after{content:"";position:absolute;left:7px;top:2px;width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.payer{min-height:40px}
.urow{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.urow .un{font-weight:700;font-size:16px}
.urow select{width:auto}
td.nw{white-space:nowrap}
@media (max-width:520px){
  .wrap{padding-top:6px}
  header.top h1{font-size:18px}
  .card{padding:12px}
  .item{flex-wrap:wrap;gap:8px 10px}
  .item .info{flex:1 1 120px}
  .item img{width:56px;height:56px}
  .item .step{width:100%;justify-content:flex-end}
  .bar .tot{font-size:16px}
  .bar .btn{padding:10px 14px}
  .login{margin-top:4vh}
  .overlay{align-items:flex-end;padding:0}
  .modal{border-radius:16px 16px 0 0;max-width:none;max-height:90vh;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  table{font-size:13px}
  .grid{grid-template-columns:1fr 1fr}
  .lrow{grid-template-columns:1fr auto}
  .lrow .lbar{grid-column:1/3;order:3}
}

input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::placeholder,textarea::placeholder{color:#a8b0c0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.fold .fh{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;min-height:32px;-webkit-user-select:none;user-select:none}
.fold .fh h2{margin:0}
.chev{color:var(--sub);transition:transform .2s;font-size:14px}
.fold.closed .chev{transform:rotate(-90deg)}
.fold.closed .fb{display:none}
.ff{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.ff .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label{font-size:13px;font-weight:700;color:var(--ink)}
.fld>label small{font-weight:400;color:var(--sub);margin-left:4px}
.fld input{border:1.5px solid var(--line);border-radius:12px;background:#fbfcfe;padding:11px 13px}
.fld input:focus{background:#fff}
.sfx{position:relative}
.sfx input{padding-right:36px;text-align:right}
.sfx span{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}
.thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#eceff5;flex:none;display:none}
.tchips{display:flex;gap:6px;flex-wrap:wrap}
.tchip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;font-size:13px;color:var(--sub);cursor:pointer;min-height:30px}
.tchip:active{background:var(--acc2);color:var(--acc)}
.foldbar{display:flex;gap:8px;justify-content:flex-end;margin:6px 0 0}
@media (max-width:520px){.ff{grid-template-columns:1fr 1fr}.ff .m1{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
const VERSION = 'v1.27';
const _AE = '';
const _dec = e => { try { return decodeURIComponent(escape(atob(e.split('').reverse().join('')))); } catch (x) { return ''; } };
const _enc = u => btoa(unescape(encodeURIComponent(u))).split('').reverse().join('');
const maskApi = u => u ? u.replace(/(\/s\/)(.{4}).*(.{4})(\/exec)/, '$1$2••••••••$3$4') : '';
const DEFAULT_API_URL = _dec(_AE);

let liveOpen = false, liveData = null, orderPick = false, orderSel = new Set(), order = null, orderVoters = [], saveTimer = null;
let API = (localStorage.getItem('vw_api') || DEFAULT_API_URL).trim();
let cfg = { title: 'Snack Poll', mode: 'list' }, menus = [], myVote = null, me = null;
let votes = [], resUsers = [], userList = [];
let page = 'vote', draft = {}, draftReady = false, editId = null, pollTimer = null, tickTimer = null, lastSig = '';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => Number(n || 0).toLocaleString('ko-KR') + '원';
const fmtT = t => { const d = new Date(t), p = x => String(x).padStart(2, '0'); return `${String(d.getFullYear()).slice(2)}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const toLocalInput = iso => { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; const p = x => String(x).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); }

async function api(action, data = {}) {
  if (!API) throw new Error('서버 주소가 설정되지 않았습니다');
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: localStorage.getItem('vw_tok') || '', ...data }) });
  if (!r.ok) throw new Error('서버 응답 오류 ' + r.status);
  return r.json();
}
async function call(action, data) {
  const j = await api(action, data);
  if (j.auth) { localStorage.removeItem('vw_tok'); me = null; stopTimers(); renderLogin(j.err); throw new Error(j.err); }
  if (j.err) throw new Error(j.err);
  return j;
}
function stopTimers() { clearInterval(pollTimer); clearInterval(tickTimer); }

async function loadState() {
  const j = await call('state');
  me = j.me; cfg = j.cfg; menus = j.menus; myVote = j.myVote;
  document.title = `${cfg.title} ${VERSION}`;
}
const sig = () => JSON.stringify([cfg, menus]);
const isOpen = () => { if (cfg.closed) return false; if (cfg.deadline && Date.now() > new Date(cfg.deadline).getTime()) return false; return true; };
const can = f => !!(me && me.can && me.can[f]);
const canSettings = () => can('settings') || can('users') || can('logs') || me.role === 'admin';

async function init() {
  if (!API) return renderLogin();
  try {
    const p = await api('pub'); cfg.title = p.title || 'Snack Poll'; cfg.mode = p.mode || 'list'; document.title = `${cfg.title} ${VERSION}`;
    if (localStorage.getItem('vw_tok')) { try { await loadState(); if (me) return enter(true); } catch (e) { if (!$('.login')) renderLogin('연결 오류: ' + e.message); return; } }
  } catch (e) { return renderLogin('서버 연결 오류: ' + e.message); }
  if (!$('.login')) renderLogin();
}
function renderLogin(err) {
  stopTimers();
  const setup = !API;
  $('#app').innerHTML = `
  <div class="login">
    <h1>${esc(cfg.title || 'Snack Poll')} <small class="muted">${VERSION}</small></h1>
    <div class="card">
      ${err ? `<div class="banner bad">${esc(err)}</div>` : ''}
      ${setup ? `<div class="banner">서버 주소가 아직 설정되지 않았습니다. 관리자는 Apps Script 웹앱 주소를 입력해 주세요.</div>
        <label class="f">서버 주소 (…/exec)</label><input type="password" autocomplete="off" id="lg-api" placeholder="https://script.google.com/macros/s/…/exec">
        <div class="row" style="margin-top:8px"><button class="btn sm" onclick="saveApi('#lg-api')">저장</button></div>`
      : `${cfg.mode === 'code' ? `<label class="f">입장 코드 (새 이름으로 처음 입장할 때만)</label><input type="text" id="lg-code" autocomplete="off"><div style="height:8px"></div>` : ''}
      <label class="f">이름</label><input type="text" id="lg-name" autocomplete="username" maxlength="20">
      <div style="height:8px"></div>
      <label class="f">비밀번호 (숫자 4자리)</label><input type="password" id="lg-pw" inputmode="numeric" maxlength="4" autocomplete="current-password">
      <div style="height:12px"></div>
      <button class="btn" style="width:100%" id="lg-go" onclick="doLogin()">입장</button>
      <p class="muted" style="margin:10px 0 0">${cfg.mode === 'code' ? '처음 쓰는 이름이면 계정이 새로 만들어지고, 다음부터는 같은 이름·비밀번호로 입장합니다.' : '관리자가 등록한 이름으로 입장합니다. 처음 입장할 때 입력한 비밀번호가 내 비밀번호가 됩니다.'}</p>`}
    </div>
  </div>`;
  if (!setup) ['#lg-name', '#lg-pw'].forEach(s => $(s).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));
}
function makeEnc() {
  const u = API; if (!u) return toast('서버 주소가 없습니다');
  openModal(`<h3>배포용 암호문</h3><p class="muted">HTML 상단의 <b>const _AE = '';</b> 따옴표 안에 아래 값을 붙여넣으면 서버 주소가 소스에 그대로 보이지 않습니다. (눈에 띄지 않게 하는 용도이며, 완전한 비밀 보호는 아닙니다)</p><textarea readonly id="enc-out" onclick="this.select()" style="height:90px">${esc(_enc(u))}</textarea><div class="row" style="margin-top:8px"><button class="btn" onclick="document.getElementById('enc-out').select();document.execCommand('copy');toast('복사했습니다')">복사</button><button class="btn sec" onclick="closeModal()">닫기</button></div>`);
}
function saveApi(sel) {
  const v = $(sel).value.trim();
  if (v && !/^https:\/\/script\.google\.com\/.+\/exec/.test(v)) return toast('Apps Script 웹앱 주소(…/exec)를 입력하세요');
  if (v) localStorage.setItem('vw_api', v); else localStorage.removeItem('vw_api');
  toast('저장했습니다. 새로고침합니다'); setTimeout(() => location.reload(), 600);
}
async function doLogin(confirmed) {
  const name = $('#lg-name').value.trim(), pw = $('#lg-pw').value.trim(), code = $('#lg-code') ? $('#lg-code').value.trim() : '';
  if (!name) return toast('이름을 입력하세요');
  if (!/^\d{4}$/.test(pw)) return toast('비밀번호는 숫자 4자리입니다');
  const btn = $('#lg-go'); btn.disabled = true; btn.textContent = '확인 중…';
  try {
    const j = await api('login', { name, pw, code, confirm: confirmed === true });
    if (j.need === 'setpw') { btn.disabled = false; btn.textContent = '입장'; if (confirm(`"${j.name}" 님은 처음 입장입니다.\n방금 입력한 4자리를 내 비밀번호로 설정할까요?`)) return doLogin(true); return; }
    if (j.need === 'create') { btn.disabled = false; btn.textContent = '입장'; if (confirm(`"${j.name}" 은(는) 새 이름입니다.\n이 이름과 비밀번호로 계정을 만들까요?`)) return doLogin(true); return; }
    if (j.err) return renderLogin(j.err);
    localStorage.setItem('vw_tok', j.token);
    if (j.mustChange) return forceChange();
    await loadState(); enter();
  } catch (e) { renderLogin('오류: ' + e.message); }
}
function forceChange() {
  openModal(`<h3>비밀번호 변경</h3><p class="muted">초기 비밀번호입니다. 새 비밀번호 4자리를 정해 주세요.</p>
    <input type="password" id="np1" inputmode="numeric" maxlength="4" placeholder="새 비밀번호 4자리">
    <div style="height:8px"></div><input type="password" id="np2" inputmode="numeric" maxlength="4" placeholder="한 번 더 입력">
    <div class="row" style="margin-top:12px"><button class="btn" id="npok">변경하고 입장</button></div>`, true);
  $('#npok').onclick = async () => {
    const a = $('#np1').value, b = $('#np2').value;
    if (!/^\d{4}$/.test(a)) return toast('숫자 4자리로 입력하세요');
    if (a !== b) return toast('두 번 입력한 값이 다릅니다');
    const j = await api('changePw', { pw: a });
    if (j.err) return toast(j.err);
    closeModal(); await loadState(); enter();
  };
}
async function logout() {
  try { await api('logout'); } catch (e) {}
  localStorage.removeItem('vw_tok'); me = null; draftReady = false; stopTimers(); renderLogin();
}

function enter(silent) {
  page = 'vote'; draftReady = false; lastSig = sig(); shell(); stopTimers();
  pollTimer = setInterval(poll, 15000); tickTimer = setInterval(tick, 1000);
}
function shell() {
  const roleName = { admin: '관리자', manager: '매니저', user: '참여자' }[me.role];
  const tabs = [['vote', '투표']];
  if (can('menu')) tabs.push(['menu', '등록']);
  if (can('results')) tabs.push(['results', '결과 보기']);
  if (can('order')) tabs.push(['order', '주문']);
  if (canSettings()) tabs.push(['settings', '설정']);
  if (!tabs.find(t => t[0] === page)) page = 'vote';
  $('#app').innerHTML = `
  <header class="top"><h1>${esc(cfg.title)}<small>${VERSION}</small></h1>
    <div class="row"><span class="chip">${esc(me.name)} · ${roleName}</span><button class="btn sec sm" onclick="logout()">로그아웃</button></div></header>
  <div class="nav">${tabs.map(t => `<button class="${page === t[0] ? 'on' : ''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</div>

function rowsToItems(rows) {
  if (!rows.length) return [];
  const ALIAS = { name: ['제품이름', '제품명', '이름', 'name'], type: ['종류', 'type'], unit: ['포장단위', '포장', '단위', 'unit'], price: ['가격', 'price'], link: ['링크', 'link', 'url'], image: ['사진주소', '사진', '이미지', 'image'] };
  const h = rows[0].map(x => x.trim().toLowerCase()); let idx = {}, hasHead = false;
  for (const [k, al] of Object.entries(ALIAS)) { const i = h.findIndex(x => al.includes(x)); if (i >= 0) { idx[k] = i; hasHead = true; } }
  if (!hasHead) idx = { name: 0, type: 1, unit: 2, price: 3, link: 4, image: 5 }; else { rows = rows.slice(1); if (idx.name === undefined) return []; }
  const g = (r, k) => (idx[k] !== undefined && r[idx[k]] !== undefined) ? String(r[idx[k]]).trim() : '';
  return rows.map(r => ({ name: g(r, 'name'), type: g(r, 'type'), unit: g(r, 'unit'), price: parseInt(g(r, 'price').replace(/[^\d]/g, '')) || 0, link: g(r, 'link'), image: g(r, 'image') })).filter(x => x.name);
}
let pendingImport = [];
async function onImportFile(inp) {
  const f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
  try {
    const buf = await f.arrayBuffer(); let text;
    try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { text = new TextDecoder('euc-kr').decode(buf); }
    pendingImport = rowsToItems(parseCSV(text));
  } catch (e) { return toast('파일을 읽지 못했습니다: ' + e.message); }
  if (!pendingImport.length) return toast('불러올 제품이 없습니다. 열 이름(제품이름 등)과 내용을 확인하세요');
  const n = pendingImport.length;
  openModal(`<h3>제품 불러오기</h3><p>${n}개 제품을 읽었습니다.${n > 300 ? ' (한 번에 300개까지만 불러옵니다)' : ''}</p>
    <div class="muted" style="margin-bottom:10px">${pendingImport.slice(0, 5).map(x => esc(x.name)).join(', ')}${n > 5 ? ' …' : ''}</div>
    <div class="row"><button class="btn" onclick="doImport(false)">기존에 추가</button><button class="btn bad" onclick="doImport(true)">전체 교체</button><button class="btn sec" onclick="closeModal()">취소</button></div>
    <p class="muted" style="margin:10px 0 0">추가: 이름과 링크가 같은 제품은 건너뜁니다. 전체 교체: 지금 등록된 제품을 모두 지우고 불러옵니다.</p>`);
}
async function doImport(replace) {
  if (replace && menus.length && !confirm(`등록된 ${menus.length}개 제품을 모두 지우고 교체할까요? 되돌릴 수 없습니다.`)) return;
  try {
    const j = await call('menuImport', { items: pendingImport, replace });
    closeModal(); await loadState(); toast(`${j.added}개 불러옴${j.skipped ? ' · 건너뜀 ' + j.skipped + '개' : ''}`); renderMenu();
  } catch (e) { toast(e.message); }
}


function namesToItems(text) {
  const out = [];
  text.split(/\r?\n/).forEach(line => {
    const r = parseCSV(line)[0]; if (!r) return;
    const f = r.map(x => String(x).trim()); if (!f[0]) return;
    const isNum = x => /^[\d,\s]+원?$/.test(x) && /\d/.test(x), num = x => parseInt(String(x).replace(/[^\d]/g, '')) || 0;
    const it = { name: f[0], type: '', unit: '', price: 0, link: '', image: '' };
    if (f.length === 2) { if (isNum(f[1])) it.price = num(f[1]); else it.type = f[1]; }
    else if (f.length >= 3) { it.type = f[1]; it.unit = f[2]; it.price = num(f.slice(3).join('')); }
    out.push(it);
  });
  return out;
}
async function bulkNames() {
  const items = namesToItems($('#n-list').value);
  if (!items.length) return toast('제품 이름을 입력하세요');
  $('#n-msg').textContent = '등록 중…';
  try {
    const j = await call('menuImport', { items, replace: false });
    $('#n-list').value = ''; await loadState(); toast(`${j.added}개 등록${j.skipped ? ' · 이미 있어서 건너뜀 ' + j.skipped + '개' : ''}`); renderMenu();
  } catch (e) { $('#n-msg').textContent = ''; toast(e.message); }
}


async function renderOrder() {
  if (!$('#main')) return;
  try { const j = await call('orderGet'); order = j.order; orderVoters = j.voters; } catch (e) { return; }
  drawOrder();
}
const menuNo = id => { const i = menus.findIndex(m => m.id === id); return i < 0 ? '-' : i + 1; };
function orderTotals() {
  let goods = 0, ship = 0, cnt = 0, done = 0;
  order.items.forEach(x => { if (!x.inc) return; cnt++; if (x.done) done++; goods += (Number(x.price) || 0) * (Number(x.qty) || 0); if (x.ship) ship += Number(x.fee) || 0; });
  return { goods, ship, total: goods + ship, cnt, done };
}
function payInfo() {
  const t = orderTotals(), P = order.pay;
  const n = orderVoters.filter(v => !P.excl.includes(v.key)).length;
  const sub = P.subsidyOn ? (Number(P.subsidy) || 0) : 0, settle = Math.max(0, t.total - sub), per = n ? Math.ceil(settle / n) : 0;
  return { ...t, n, sub, settle, per, diff: per * n - settle };
}
function orderCard(x, i) {
  return `<div class="card ord ${x.done ? 'done' : ''}" id="o-${i}">
    <div class="row" style="justify-content:space-between">
      <div class="row"><input type="checkbox" class="pick" title="합계에 포함" ${x.inc ? 'checked' : ''} onchange="oSet(${i},'inc',this.checked)"><span class="no">${menuNo(x.id)}</span><span class="nm">${esc(x.name)}</span><span class="muted">${esc(x.unit)}</span><span class="chip" id="od-${i}" style="display:${x.done ? 'inline-flex' : 'none'}">✔ 주문 완료</span></div>
      <div class="row">${x.link ? `<a class="btn sec sm" href="${esc(x.link)}" target="_blank" rel="noopener">사이트 열기</a>` : '<span class="muted">링크 없음</span>'}<button class="btn bad sm" onclick="oDel(${i})">삭제</button></div></div>
    <div class="grid" style="margin-top:8px">
      <div><label class="f">가격(원)</label><input type="number" min="0" value="${x.price}" oninput="oSet(${i},'price',this.value)"></div>
      <div><label class="f">수량</label><input type="number" min="0" value="${x.qty}" oninput="oSet(${i},'qty',this.value)"></div>
      <div><label class="f">소계 (배송비 포함)</label><div class="nm" id="ol-${i}">-</div></div></div>
    <div class="row" style="margin-top:8px">
      <label class="row" style="gap:4px"><input type="checkbox" ${x.ship ? 'checked' : ''} onchange="oSet(${i},'ship',this.checked)"> 배송비</label>
      <input type="number" min="0" id="of-${i}" value="${x.fee || ''}" placeholder="배송비 입력(원)" style="width:150px;display:${x.ship ? 'block' : 'none'}" oninput="oSet(${i},'fee',this.value)">
      <label class="row" style="gap:4px;margin-left:auto"><input type="checkbox" ${x.done ? 'checked' : ''} onchange="oSet(${i},'done',this.checked)"> 주문 완료</label></div></div>`;
}
function drawOrder() {
  if (page !== 'order' || !$('#main')) return;
  const P = order.pay;
  $('#main').innerHTML = `
  <div class="pagehead"><h2 style="margin:6px 0">주문</h2><div class="row"><span class="muted" id="o-save"></span><button class="btn bad sm" onclick="clearOrder()">주문 목록 비우기</button></div></div>
  ${order.items.length ? order.items.map(orderCard).join('') : '<div class="card muted">주문 목록이 비어 있습니다. "결과 보기"에서 "주문하기"를 눌러 품목을 담아 주세요.</div>'}
  <div class="card" id="o-sum"></div>
  <div class="card"><h2>비용 계산</h2>
    <div class="muted">정산에 포함할 참여자를 눌러 선택하세요. 선택된 인원으로 나눕니다.</div>
    <div class="row" style="margin:8px 0" id="pay-chips"></div>
    <div class="row" style="margin-bottom:8px"><button class="btn sec sm" onclick="payAll(true)">전체 선택</button><button class="btn sec sm" onclick="payAll(false)">전체 해제</button></div>
    <div class="row"><label class="row" style="gap:4px"><input type="checkbox" ${P.subsidyOn ? 'checked' : ''} onchange="paySet('subsidyOn',this.checked)"> 지원금 있음</label>
      <input type="number" min="0" id="sub-amt" value="${P.subsidy || ''}" placeholder="지원금 입력(원)" style="width:160px;display:${P.subsidyOn ? 'block' : 'none'}" oninput="paySet('subsidy',this.value)"></div>
    <div id="pay-res" style="margin-top:10px"></div>
    <div class="row" style="margin-top:8px"><button class="btn" onclick="copyPay()">정산 안내 복사</button></div></div>`;
  refreshOrderUI();
}
function refreshOrderUI() {
  if (!order || !$('#o-sum')) return;
  order.items.forEach((x, i) => { const e = $('#ol-' + i); if (e) e.textContent = won((Number(x.price) || 0) * (Number(x.qty) || 0) + (x.ship ? Number(x.fee) || 0 : 0)); });
  const p = payInfo();
  $('#o-sum').innerHTML = `<h2>합산 금액</h2>
    <div class="row" style="justify-content:space-between"><span>상품 합계</span><b>${won(p.goods)}</b></div>
    <div class="row" style="justify-content:space-between"><span>배송비 합계</span><b>${won(p.ship)}</b></div>
    <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:6px;margin-top:6px"><span>총 금액</span><span class="bigsum">${won(p.total)}</span></div>
    <div class="muted" style="margin-top:4px">합계에 포함된 ${p.cnt}개 품목 중 주문 완료 ${p.done}개</div>`;
  $('#pay-chips').innerHTML = orderVoters.length ? orderVoters.map((v, i) => `<button class="payer ${order.pay.excl.includes(v.key) ? '' : 'on'}" onclick="payToggle(${i})">${esc(v.name)}</button>`).join('') : '<span class="muted">투표 참여자가 없습니다.</span>';
  $('#pay-res').innerHTML = `
    <div class="row" style="justify-content:space-between"><span>총 금액</span><b>${won(p.total)}</b></div>
    ${order.pay.subsidyOn ? `<div class="row" style="justify-content:space-between"><span>지원금</span><b>− ${won(p.sub)}</b></div>` : ''}
    <div class="row" style="justify-content:space-between"><span>정산 금액</span><b>${won(p.settle)}</b></div>
    <div class="row" style="justify-content:space-between"><span>정산 인원</span><b>${p.n}명</b></div>
    <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:6px;margin-top:6px"><span>1인당</span><span class="bigsum">${p.n ? won(p.per) : '-'}</span></div>
    ${p.n && p.diff ? `<div class="muted">원 단위 올림 기준 · 걷는 합계가 ${won(p.diff)} 더 많습니다</div>` : ''}`;
}
function oSet(i, k, v) {
  const x = order.items[i]; if (!x) return;
  if (k === 'price' || k === 'qty' || k === 'fee') x[k] = Math.max(0, Number(v) || 0); else x[k] = v;
  if (k === 'ship') { const e = $('#of-' + i); if (e) e.style.display = v ? 'block' : 'none'; }
  if (k === 'done') { const c = $('#o-' + i), b = $('#od-' + i); if (c) c.classList.toggle('done', v); if (b) b.style.display = v ? 'inline-flex' : 'none'; }
  refreshOrderUI(); scheduleSave();
}
function oDel(i) { if (!confirm('이 품목을 주문 목록에서 뺄까요?')) return; order.items.splice(i, 1); scheduleSave(); drawOrder(); }
function paySet(k, v) {
  if (k === 'subsidy') order.pay.subsidy = Math.max(0, Number(v) || 0); else order.pay[k] = v;
  if (k === 'subsidyOn') { const e = $('#sub-amt'); if (e) e.style.display = v ? 'block' : 'none'; }
  refreshOrderUI(); scheduleSave();
}
function payToggle(n) { const key = orderVoters[n].key, a = order.pay.excl, i = a.indexOf(key); if (i >= 0) a.splice(i, 1); else a.push(key); refreshOrderUI(); scheduleSave(); }
function payAll(on) { order.pay.excl = on ? [] : orderVoters.map(v => v.key); refreshOrderUI(); scheduleSave(); }
function scheduleSave() { const e = $('#o-save'); if (e) e.textContent = '저장 중…'; clearTimeout(saveTimer); saveTimer = setTimeout(async () => { saveTimer = null; try { await saveOrder(); const e2 = $('#o-save'); if (e2) e2.textContent = '저장됨'; } catch (er) { const e2 = $('#o-save'); if (e2) e2.textContent = '저장 실패'; toast(er.message); } }, 700); }
async function saveOrder() { await call('orderSave', { order }); }
async function clearOrder() { if (!confirm('주문 목록과 정산 설정을 모두 비울까요?')) return; try { await call('orderClear'); await renderOrder(); } catch (e) { toast(e.message); } }
async function copyPay() {
  const p = payInfo(), L = [`[${cfg.title}] 정산 안내`, `총 금액 ${won(p.total)} (상품 ${won(p.goods)} + 배송비 ${won(p.ship)})`];
  if (order.pay.subsidyOn) L.push(`지원금 ${won(p.sub)}`);
  L.push(`정산 금액 ${won(p.settle)} ÷ ${p.n}명 = 1인당 ${p.n ? won(p.per) : '-'}`);
  const names = orderVoters.filter(v => !order.pay.excl.includes(v.key)).map(v => v.name); if (names.length) L.push('정산 대상: ' + names.join(', '));
  try { await navigator.clipboard.writeText(L.join('\n')); toast('복사했습니다'); } catch { toast('복사 실패'); }
}

init();
</script>
</body>
</html>
